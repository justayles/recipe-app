<h2>Confirm your Recipeek email</h2>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email">Open Recipeek to confirm</a></p>
<p>Or type this code in the app:</p>
<p style="font-size:28px;letter-spacing:4px;font-weight:bold">{{ .Token }}</p>
<p>It expires in one hour. If you did not create a Recipeek account, you can ignore this email.</p>
